# fly.toml app configuration file generated for czyja-dzialka on 2026-04-27T18:15:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'czyja-dzialka'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
